# Apollo Router Configuration for GraphOS
# Production-ready configuration with JWT authentication
# Router v2.14.0+ required
#
# Required Environment Variables:
#   APOLLO_KEY: Your Apollo GraphOS API key
#   APOLLO_GRAPH_REF: graph-name@variant (e.g., lole-production@current)
#   NEXT_PUBLIC_SUPABASE_URL: Supabase project URL (for JWT JWKS)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY: Supabase anon key for public operations

# GraphOS supergraph configuration
supergraph:
    listen: 0.0.0.0:4000
    path: /graphql

# Health check endpoint
health_check:
    listen: 0.0.0.0:8088

# Fetch supergraph from GraphOS (using environment variables)
apollo:
    api_key: ${APOLLO_KEY}
    graph_ref: ${APOLLO_GRAPH_REF}

# CORS configuration
cors:
    origins:
        - 'https://lole.app'
        - 'https://www.lole.app'
        - 'https://lolemenu.com'
        - 'https://www.lolemenu.com'
        - 'http://localhost:3000'
        - 'http://localhost:3001'
    methods:
        - GET
        - POST
        - OPTIONS
    headers:
        - authorization
        - content-type
        - x-guest-session
        - x-lole-request-id
        - x-restaurant-id
    credentials: true

# Authentication - JWT verification via Supabase
authentication:
    router:
        jwt:
            jwks:
                - url: ${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/.well-known/jwks.json
            issuer: ${NEXT_PUBLIC_SUPABASE_URL}
            audience:
                - authenticated
                - anon

# Authorization rules
authorization:
    require_authentication:
        operations:
            - mutation.*
            - query.activeOrders
            - query.orders
            - query.kdsOrders
        message: 'Authentication required for this operation'

# Rate limiting
traffic_shaping:
    router:
        rate_limit:
            capacity: 1000
            interval: 1s
        timeout: 30s
    subgraphs:
        default:
            rate_limit:
                capacity: 500
                interval: 1s
            timeout: 10s
        orders:
            rate_limit:
                capacity: 300
                interval: 1s
        payments:
            rate_limit:
                capacity: 100
                interval: 1s

# Query complexity and depth limits
limits:
    max_depth: 10
    max_aliases: 30
    max_tokens: 10000
    max_query_size: 524288 # 512KB

# BKND-007: Persisted query list (operation safelist)
# When enabled, only whitelisted operations can be executed.
# This prevents malicious or accidental resource-intensive queries.
# Uncomment and populate the safelist in production:
# persisted_queries:
#     enabled: ${PERSISTED_QUERIES_ENABLED:-false}
#     safelist:
#         enabled: true
#     log_unknown: true

# BKND-008: Query cost analysis (demand control)
# Limits query execution based on estimated cost.
# Prevents resource exhaustion from expensive queries.
# Uncomment in production:
# demand_control:
#     enabled: ${DEMAND_CONTROL_ENABLED:-false}
#     mode: measure  # measure | enforce
#     strategy:
#         static_estimated:
#             list_size: 100
#             max_cost: 5000
#     break_on_first_error: true

# Include subgraph errors in response (disable in production)
include_subgraph_errors:
    all: ${INCLUDE_SUBGRAPH_ERRORS:-false}

# Request/Response headers
headers:
    all:
        request:
            - propagate:
                  named: 'authorization'
            - propagate:
                  named: 'x-lole-request-id'
            - propagate:
                  named: 'x-guest-session'
            - propagate:
                  named: 'x-restaurant-id'
            # Extract user info from JWT and pass to subgraphs
            - insert:
                  name: 'x-user-id'
                  from_request_header:
                      named: 'authorization'
                      claim: 'sub'
            - insert:
                  name: 'x-user-role'
                  from_request_header:
                      named: 'authorization'
                      claim: 'role'
            - insert:
                  name: 'x-restaurant-id'
                  from_request_header:
                      named: 'authorization'
                      claim: 'restaurant_id'
        response:
            - set:
                  named: 'x-lole-router-version'
                  value: '2.14.0'

# Telemetry and observability
telemetry:
    tracing:
        trace_config:
            service_name: 'lole-router'
            service_namespace: 'lole'
        otlp:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
            protocol: grpc
    metrics:
        prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics

# Logging
logging:
    level: ${LOG_LEVEL:-info}
    format: json

# Entity caching (optional, requires Redis)
# entities:
#     cache:
#         redis:
#             urls:
#                 - ${REDIS_URL}

# =============================================================================
# Railway Deployment Notes
# =============================================================================
# Deploy to Railway with the following environment variables:
#
# Required:
#   APOLLO_KEY                   - Apollo GraphOS API key
#   APOLLO_GRAPH_REF             - graph-name@variant (e.g., lole-production@current)
#   NEXT_PUBLIC_SUPABASE_URL     - Supabase project URL (for JWT JWKS)
#
# Optional:
#   LOG_LEVEL                    - Log level (debug, info, warn, error)
#   INCLUDE_SUBGRAPH_ERRORS      - Include subgraph errors in response (true/false)
#   OTEL_EXPORTER_OTLP_ENDPOINT  - OpenTelemetry collector endpoint
#   REDIS_URL                    - Redis connection string for entity caching
#
# Railway Configuration:
#   - Dockerfile path: router/Dockerfile
#   - Health check: /health on port 8088 (exposed automatically)
#   - GraphQL endpoint: port 4000
#   - Start command: docker run -p 4000:4000 -p 8088:8088 -e APOLLO_KEY -e APOLLO_GRAPH_REF <image>
#
# Scaling considerations:
#   - Rate limits scale with instance count
#   - Consider Redis for entity caching when scaling beyond 1 instance
