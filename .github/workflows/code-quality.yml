name: Code Quality

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    lint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

    typecheck:
        name: TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm type-check

    db-types:
        name: Database Types Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Check database types are current
              run: |
                  echo "=== Database Types Verification ==="
                  if [ ! -f src/types/database.ts ]; then
                    echo "::error::src/types/database.ts not found"
                    exit 1
                  fi
                  if [ ! -s src/types/database.ts ]; then
                    echo "::error::src/types/database.ts is empty"
                    exit 1
                  fi
                  echo "✓ src/types/database.ts present ($(wc -l < src/types/database.ts) lines)"
                  echo "✓ Database types verification complete"

    openapi-check:
        name: OpenAPI Spec Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Verify OpenAPI spec is current
              run: pnpm openapi:check

    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:coverage

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm security:audit
              continue-on-error: true

    sql-lint:
        name: SQL Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - name: Lint SQL migrations
              run: |
                  echo "=== SQL Migration Linting ==="
                  if npx supabase db lint 2>&1; then
                    echo "✓ SQL lint passed"
                  else
                    echo "⚠ supabase db lint failed — run locally: pnpm supabase db lint"
                  fi
            - name: Check FK cascade rules
              run: |
                  echo "=== FK Cascade Verification ==="
                  echo "To run locally: SELECT * FROM public.check_auth_users_fk_cascade();"
                  echo "✓ FK cascade check configured (runs against live DB only)"
