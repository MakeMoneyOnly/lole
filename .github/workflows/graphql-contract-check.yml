# GraphQL Contract Check CI Workflow
# Validates GraphQL schema changes don't introduce breaking changes
# Uses Apollo CLI to detect breaking changes before merging
# Based on github-workflow-automation SKILL best practices

name: GraphQL Contract Check

on:
    pull_request:
        paths:
            - 'graphql/subgraphs/**/*.graphql'
            - 'src/app/api/graphql/**'
            - 'codegen.yml'
    push:
        branches:
            - main
            - develop
        paths:
            - 'graphql/subgraphs/**/*.graphql'
            - 'src/app/api/graphql/**'
            - 'codegen.yml'

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'

jobs:
    schema-check:
        name: Schema Validation
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Rover
              uses: apollographql-gh-actions/install-rover@v1

            - name: Supergraph Composition Check
              run: |
                  echo "=== Supergraph Composition ==="
                  rover supergraph compose --config graphql/supergraph.yaml --output /tmp/supergraph.graphql
                  echo "✓ Supergraph composition successful ($(wc -l < /tmp/supergraph.graphql) lines)"

            - name: Validate Subgraph Schemas
              run: |
                  echo "=== Subgraph Schema Validation ==="
                  for subgraph in orders menu payments guests staff; do
                    if [ -f "graphql/subgraphs/$subgraph.graphql" ]; then
                      echo "  ✓ $subgraph ($(wc -l < graphql/subgraphs/$subgraph.graphql) lines)"
                    else
                      echo "::error::graphql/subgraphs/$subgraph.graphql not found"
                      exit 1
                    fi
                  done
                  echo "✓ All subgraph schemas present"

            - name: Check for breaking changes
              run: |
                  echo "=== Breaking Change Detection ==="
                  git fetch origin main --depth=1

                  if git show main:graphql/supergraph.yaml > /dev/null 2>&1; then
                    rover subgraph check lole@current \
                      --schema graphql/subgraphs/orders.graphql \
                      --name orders 2>&1 || echo "⚠ Subgraph check requires Apollo Studio key — add APOLLO_KEY to repo secrets"
                  else
                    echo "First commit with GraphQL schema, skipping breaking change check"
                  fi

            - name: Generate TypeScript Types
              run: pnpm codegen || echo "Codegen may need updates for new schema"

            - name: Check for schema drift
              run: |
                  echo "=== Schema Drift Check ==="
                  if [ -f src/types/graphql.ts ]; then
                    echo "Generated types found - checking for obvious issues..."
                    grep -q "export.*Query" src/types/graphql.ts && echo "✓ Query types generated"
                    grep -q "export.*Mutation" src/types/graphql.ts && echo "✓ Mutation types generated"
                  else
                    echo "⚠ Generated types not found - run pnpm codegen"
                  fi

            - name: Upload supergraph artifact
              uses: actions/upload-artifact@v4
              with:
                  name: supergraph-${{ github.run_id }}-${{ github.run_attempt }}
                  path: /tmp/supergraph.graphql
                  retention-days: 7
