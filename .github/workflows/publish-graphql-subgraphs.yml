# GraphQL Subgraph Publishing Workflow
# Publishes subgraph schemas to Apollo GraphOS on push to main
# Based on github-workflow-automation SKILL best practices

name: Publish GraphQL Subgraphs

on:
    push:
        branches:
            - main
        paths:
            - 'graphql/subgraphs/**/*.graphql'
            - 'src/domains/*/graphql-schema.ts'

permissions:
    contents: read
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    APOLLO_GRAPH_REF: lole-production-tj1sjiw@current
    APOLLO_KEY: ${{ secrets.APOLLO_KEY }}

jobs:
    check-and-publish:
        name: Check Breaking Changes & Publish Subgraphs
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rover
              uses: apollographql-gh-actions/install-rover@v1

            - name: Detect changed subgraphs
              id: changes
              run: |
                  CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'graphql/subgraphs/*.graphql' 'src/domains/*/graphql-schema.ts' || echo "")

                  SUBGRAPHS=""
                  if echo "$CHANGED_FILES" | grep -q "orders"; then
                    SUBGRAPHS="$SUBGRAPHS orders"
                  fi
                  if echo "$CHANGED_FILES" | grep -q "menu"; then
                    SUBGRAPHS="$SUBGRAPHS menu"
                  fi
                  if echo "$CHANGED_FILES" | grep -q "payments"; then
                    SUBGRAPHS="$SUBGRAPHS payments"
                  fi
                  if echo "$CHANGED_FILES" | grep -q "guests"; then
                    SUBGRAPHS="$SUBGRAPHS guests"
                  fi
                  if echo "$CHANGED_FILES" | grep -q "staff"; then
                    SUBGRAPHS="$SUBGRAPHS staff"
                  fi

                  if [ -z "$SUBGRAPHS" ]; then
                    SUBGRAPHS="orders menu payments guests staff"
                  fi

                  echo "subgraphs=$SUBGRAPHS" >> $GITHUB_OUTPUT
                  echo "Subgraphs to publish: $SUBGRAPHS"

            - name: Check Orders Subgraph for Breaking Changes
              if: contains(steps.changes.outputs.subgraphs, 'orders')
              continue-on-error: true
              run: |
                  rover subgraph check ${{ env.APOLLO_GRAPH_REF }} \
                      --name orders \
                      --schema ./graphql/subgraphs/orders.graphql

            - name: Check Menu Subgraph for Breaking Changes
              if: contains(steps.changes.outputs.subgraphs, 'menu')
              continue-on-error: true
              run: |
                  rover subgraph check ${{ env.APOLLO_GRAPH_REF }} \
                      --name menu \
                      --schema ./graphql/subgraphs/menu.graphql

            - name: Check Payments Subgraph for Breaking Changes
              if: contains(steps.changes.outputs.subgraphs, 'payments')
              continue-on-error: true
              run: |
                  rover subgraph check ${{ env.APOLLO_GRAPH_REF }} \
                      --name payments \
                      --schema ./graphql/subgraphs/payments.graphql

            - name: Check Guests Subgraph for Breaking Changes
              if: contains(steps.changes.outputs.subgraphs, 'guests')
              continue-on-error: true
              run: |
                  rover subgraph check ${{ env.APOLLO_GRAPH_REF }} \
                      --name guests \
                      --schema ./graphql/subgraphs/guests.graphql

            - name: Check Staff Subgraph for Breaking Changes
              if: contains(steps.changes.outputs.subgraphs, 'staff')
              continue-on-error: true
              run: |
                  rover subgraph check ${{ env.APOLLO_GRAPH_REF }} \
                      --name staff \
                      --schema ./graphql/subgraphs/staff.graphql

            - name: Publish Orders Subgraph
              if: contains(steps.changes.outputs.subgraphs, 'orders')
              run: |
                  rover subgraph publish ${{ env.APOLLO_GRAPH_REF }} \
                      --name orders \
                      --schema ./graphql/subgraphs/orders.graphql \
                      --routing-url https://lole.app/api/subgraphs/orders

            - name: Publish Menu Subgraph
              if: contains(steps.changes.outputs.subgraphs, 'menu')
              run: |
                  rover subgraph publish ${{ env.APOLLO_GRAPH_REF }} \
                      --name menu \
                      --schema ./graphql/subgraphs/menu.graphql \
                      --routing-url https://lole.app/api/subgraphs/menu

            - name: Publish Payments Subgraph
              if: contains(steps.changes.outputs.subgraphs, 'payments')
              run: |
                  rover subgraph publish ${{ env.APOLLO_GRAPH_REF }} \
                      --name payments \
                      --schema ./graphql/subgraphs/payments.graphql \
                      --routing-url https://lole.app/api/subgraphs/payments

            - name: Publish Guests Subgraph
              if: contains(steps.changes.outputs.subgraphs, 'guests')
              run: |
                  rover subgraph publish ${{ env.APOLLO_GRAPH_REF }} \
                      --name guests \
                      --schema ./graphql/subgraphs/guests.graphql \
                      --routing-url https://lole.app/api/subgraphs/guests

            - name: Publish Staff Subgraph
              if: contains(steps.changes.outputs.subgraphs, 'staff')
              run: |
                  rover subgraph publish ${{ env.APOLLO_GRAPH_REF }} \
                      --name staff \
                      --schema ./graphql/subgraphs/staff.graphql \
                      --routing-url https://lole.app/api/subgraphs/staff

            - name: Summary
              run: |
                  echo "## 🚀 GraphQL Subgraphs Published" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Graph Ref:** ${{ env.APOLLO_GRAPH_REF }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Subgraphs:** ${{ steps.changes.outputs.subgraphs }}" >> $GITHUB_STEP_SUMMARY
