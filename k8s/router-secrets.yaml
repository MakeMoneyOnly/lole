# Secret manifest for Apollo Router
# Apply this to create the secrets required by the deployment
#
# Create the secrets manually:
# kubectl create secret generic apollo-router-secrets \
#   --from-literal=apollo-key=<your-apollo-key> \
#   --from-literal=graph-ref=<graph-name>@<variant> \
#   --from-literal=supabase-url=https://<your-project>.supabase.co
#
# Or apply this template with your values:

apiVersion: v1
kind: Secret
metadata:
  name: apollo-router-secrets
  labels:
    app: apollo-router
type: Opaque
stringData:
  apollo-key: ""  # APOLLO_KEY: Apollo GraphOS API key
  graph-ref: ""   # APOLLO_GRAPH_REF: e.g., lole-production@current
  supabase-url: ""  # NEXT_PUBLIC_SUPABASE_URL: Your Supabase project URL