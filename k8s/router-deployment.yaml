apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-router-config
  labels:
    app: apollo-router
    component: graphql-gateway
data:
  router.yaml: |
    supergraph:
      listen: 0.0.0.0:4000
      path: /graphql

    health_check:
      listen: 0.0.0.0:8088

    apollo:
      api_key: ${APOLLO_KEY}
      graph_ref: ${APOLLO_GRAPH_REF}

    cors:
      origins:
        - 'https://lole.app'
        - 'https://www.lole.app'
        - 'https://lolemenu.com'
        - 'https://www.lolemenu.com'
        - 'http://localhost:3000'
        - 'http://localhost:3001'
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - authorization
        - content-type
        - x-guest-session
        - x-lole-request-id
        - x-restaurant-id
      credentials: true

    authentication:
      router:
        jwt:
          jwks:
            - url: ${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/.well-known/jwks.json
          issuer: ${NEXT_PUBLIC_SUPABASE_URL}
          audience:
            - authenticated
            - anon
          header_name: Authorization
          header_value_prefix: Bearer

    authorization:
      require_authentication:
        operations:
          - mutation.*
          - query.activeOrders
          - query.orders
          - query.kdsOrders
        message: 'Authentication required for this operation'

    traffic_shaping:
      router:
        rate_limit:
          capacity: 1000
          interval: 1s
          timeout: 30s
      subgraphs:
        default:
          rate_limit:
            capacity: 500
            interval: 1s
            timeout: 10s

    limits:
      max_depth: 10
      max_aliases: 30
      max_tokens: 10000
      max_query_size: 524288

    include_subgraph_errors:
      all: false

    headers:
      all:
        request:
          - propagate:
              named: 'authorization'
          - propagate:
              named: 'x-lole-request-id'
          - propagate:
              named: 'x-guest-session'
          - propagate:
              named: 'x-restaurant-id'
        response:
          - set:
              named: 'x-lole-router-version'
              value: '2.1.0'

    telemetry:
      tracing:
        trace_config:
          service_name: 'lole-router'
          service_namespace: 'lole'
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
          protocol: grpc
      metrics:
        prometheus:
          enabled: true
          listen: 0.0.0.0:9090
          path: /metrics

    logging:
      level: ${LOG_LEVEL:-info}
      format: json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollo-router
  labels:
    app: apollo-router
    component: graphql-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apollo-router
  template:
    metadata:
      labels:
        app: apollo-router
        component: graphql-gateway
    spec:
      containers:
        - name: router
          image: ghcr.io/apollographql/apollo-router:v2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: graphql
            - containerPort: 8088
              name: health
            - containerPort: 9090
              name: metrics
          env:
            - name: APOLLO_KEY
              valueFrom:
                secretKeyRef:
                  name: apollo-router-secrets
                  key: apollo-key
            - name: APOLLO_GRAPH_REF
              valueFrom:
                secretKeyRef:
                  name: apollo-router-secrets
                  key: graph-ref
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apollo-router-secrets
                  key: supabase-url
            - name: LOG_LEVEL
              value: "info"
            - name: ROUTER_CONFIG_PATH
              value: /config/router.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: router-config
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: router-config
          configMap:
            name: apollo-router-config
            items:
              - key: router.yaml
                path: router.yaml
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: apollo-router
  labels:
    app: apollo-router
    component: graphql-gateway
spec:
  type: ClusterIP
  selector:
    app: apollo-router
  ports:
    - name: graphql
      port: 4000
      targetPort: graphql
    - name: health
      port: 8088
      targetPort: health
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apollo-router-hpa
  labels:
    app: apollo-router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apollo-router
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60